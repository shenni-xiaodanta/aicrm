<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商机工作台</title>
  <!-- 所有页签模块的样式都在此页面加载，抽屉内各页签共用 -->
  <link rel="stylesheet" href="/static/common/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/common/css/common.css">
  <link rel="stylesheet" href="/static/shangji/css/map.css">
  <link rel="stylesheet" href="/static/source/css/source.css">
  <link rel="stylesheet" href="/static/followup/css/followup.css">
  <link rel="stylesheet" href="/static/attachment/css/attachment.css">
  <link rel="stylesheet" href="/static/chat/css/chat.css">
  <link rel="stylesheet" href="/static/owner/css/owner.css">
  <link rel="stylesheet" href="/static/summary/css/summary.css">
  <!-- 两个占位符由后端 map_page() 在返回 HTML 时替换为真实配置 -->
  <script>__AMAP_SECURITY_CONFIG__</script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=__AMAP_JS_KEY__"></script>
</head>
<body class="d-flex flex-column vh-100">
  <nav class="navbar bg-white border-bottom shadow-sm px-3">
    <span class="navbar-brand mb-0 fw-semibold">商机工作台</span>

    <ul class="navbar-nav me-auto ms-3">
      <li class="nav-item dropdown">
        <button id="crawlMenuToggle" type="button" class="nav-link dropdown-toggle"
                data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
          商机采集
        </button>
        <ul id="crawlProvinceMenu" class="dropdown-menu"></ul>
      </li>
    </ul>

    <div class="d-flex align-items-center gap-2">
      <span class="text-muted small">共 <span id="count" class="fw-bold text-primary">0</span> 个</span>
      <span class="badge rounded-pill text-bg-danger">高</span>
      <span class="badge rounded-pill text-bg-primary">中</span>
      <span class="badge rounded-pill text-bg-secondary">低</span>
      <button id="refresh" type="button" class="btn btn-sm btn-outline-primary ms-2">刷新</button>
      <button id="logout" type="button" class="btn btn-sm btn-outline-secondary">退出</button>
    </div>
  </nav>

  <!-- 检索条件：列表和地图共用同一组筛选，切换视图不丢条件 -->
  <div class="filter-bar bg-white border-bottom px-3 py-2 d-flex align-items-center gap-2 flex-wrap">
    <select id="filterIndustry" class="form-select form-select-sm">
      <option value="">全部行业</option>
    </select>
    <select id="filterIntent" class="form-select form-select-sm">
      <option value="">全部意向</option>
      <option value="高">高</option>
      <option value="中">中</option>
      <option value="低">低</option>
    </select>
    <select id="filterRegion" class="form-select form-select-sm">
      <option value="">全部区域</option>
    </select>
    <input id="filterKeyword" type="search" class="form-control form-control-sm wb-kw"
           placeholder="搜标题 / 客户 / 概述">
    <button id="filterReset" type="button" class="btn btn-sm btn-outline-secondary">重置</button>
    <span class="text-muted small ms-auto">显示 <b id="visibleCount">0</b> 个</span>
    <div id="viewSeg" class="view-seg" role="group" aria-label="视图切换">
      <button type="button" class="btn btn-sm seg active" data-view="table">列表</button>
      <button type="button" class="btn btn-sm seg" data-view="map">地图</button>
    </div>
  </div>

  <!-- 列表视图：与地图共用筛选结果，点行开抽屉 -->
  <main id="viewList" class="flex-grow-1 wb-list-pane">
    <table id="leadTable" class="wb-table">
      <thead>
        <tr>
          <th>商机标题</th>
          <th>地区</th>
          <th>行业</th>
          <th class="sortable" data-sort="budget">预算<span class="arrow"></span></th>
          <th>意向</th>
          <th>联系人</th>
          <th class="sortable on" data-sort="id">采集时间<span class="arrow">↓</span></th>
        </tr>
      </thead>
      <tbody id="leadTbody"></tbody>
    </table>
  </main>

  <!-- 地图视图：首次切换时才初始化（隐藏容器里建 AMap 会白屏） -->
  <main id="map" class="flex-grow-1 d-none"></main>

  <!-- 状态栏：无坐标商机只在列表出现，地图不画 -->
  <div class="wb-statusbar">
    共 <b id="statusTotal">0</b> 条 · 其中 <b id="statusGeo">0</b> 条有坐标
    <span class="wb-hint">地图只画有坐标的商机，剩下的在列表里</span>
  </div>

  <div id="loading" class="position-fixed top-50 start-50 translate-middle text-center d-none">
    <div class="spinner-border text-primary" role="status"></div>
    <div class="small text-muted mt-2">加载商机...</div>
  </div>
  <div id="notice" class="alert alert-warning shadow-sm position-fixed bottom-0 start-50 translate-middle-x mb-3 d-none" role="alert"></div>

  <!-- 商机详情抽屉：每次打开整体重建内容子树（沿用 InfoWindow 时代的页签挂载契约） -->
  <aside id="drawer" class="wb-drawer" aria-hidden="true">
    <div id="drawerContent" class="h-100"></div>
  </aside>

  <!-- 商机采集弹窗（批2 改造为地区选择 + 任务进度，本批保持原样） -->
  <div class="modal fade" id="crawlModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">商机采集 <span id="crawlRegion" class="text-muted fs-6"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <div id="crawlAlert" class="alert py-2 small d-none" role="alert"></div>
          <div class="mb-3">
            <label class="form-label" for="crawlBaseDomain">域名（base_domain）：</label>
            <input id="crawlBaseDomain" class="form-control"
                   placeholder="https://ggzy.hefei.gov.cn">
            <div class="form-text">只填协议 + 域名，不要带列表页路径。</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="crawlListUrl">列表页网址（list_url）：</label>
            <input id="crawlListUrl" class="form-control"
                   placeholder="https://.../2.html">
            <div class="form-text">填完整的列表页链接。</div>
          </div>
          <div id="crawlResult" class="alert alert-success py-2 small d-none" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button id="crawlSave" type="button" class="btn btn-outline-primary">保存</button>
          <button id="crawlRun" type="button" class="btn btn-primary">执行</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 加载顺序有依赖：Bootstrap -> 公共工具 -> 工作台 -> 各页签模块。
       map.js 依赖 App，并在打开抽屉时调用 ChatPage.init。 -->
  <script src="/static/common/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/common/js/common.js"></script>
  <script src="/static/shangji/js/map.js"></script>
  <script src="/static/source/js/source.js"></script>
  <script src="/static/followup/js/followup.js"></script>
  <script src="/static/attachment/js/attachment.js"></script>
  <script src="/static/chat/js/chat.js"></script>
  <script src="/static/owner/js/owner.js"></script>
  <script src="/static/summary/js/summary.js"></script>
</body>
</html>
