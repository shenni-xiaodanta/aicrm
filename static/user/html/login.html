<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 商机系统</title>
  <link rel="stylesheet" href="/static/common/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/common/css/common.css">
  <link rel="stylesheet" href="/static/user/css/auth.css">
</head>
<body class="auth-body d-flex align-items-center justify-content-center py-4">
  <div class="card auth-card border-0 shadow-lg">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="auth-logo">CRM</div>
        <h4 class="fw-bold mt-3 mb-1">商机系统</h4>
        <p class="text-muted small mb-0">登录后查看商机地图</p>
      </div>

      <div id="alert" class="alert py-2 small d-none" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" for="username">用户名</label>
          <input id="username" name="username" class="form-control" autocomplete="username"
                 placeholder="请输入用户名" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">密码</label>
          <input id="password" name="password" type="password" class="form-control"
                 autocomplete="current-password" placeholder="请输入密码" required>
        </div>
        <button id="submit" type="submit" class="btn btn-primary w-100">登 录</button>
      </form>

      <div class="text-center small text-muted mt-4">
        还没有账号？<a href="/register">立即注册</a>
      </div>
    </div>
  </div>

  <script src="/static/common/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/common/js/common.js"></script>
  <script src="/static/user/js/login.js"></script>
</body>
</html>
